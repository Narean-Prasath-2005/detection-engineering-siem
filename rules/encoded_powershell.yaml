title: Suspicious Encoded PowerShell Execution
id: DET-0001
status: stable
description: Detects PowerShell launched with Base64-encoded commands, commonly used to obfuscate malicious activity.

author: Narean Prasath

date: 2026-07-07

logsource:
  product: windows
  category: process_creation

detection:
  selection:
    process_name: powershell.exe
    commandline_contains:
      - "-enc"
      - "-encodedcommand"
  condition: selection

falsepositives:
  - Administrative automation scripts
  - Legitimate software deployment tools

level: high

mitre:
  tactic: Execution
  technique: PowerShell
  attack_id: T1059.001

references:
  - https://attack.mitre.org/techniques/T1059/001/

tags:
  - powershell
  - execution