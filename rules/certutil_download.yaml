title: File Download using Certutil
id: DET-0005
status: stable
description: Detects abuse of certutil.exe to download remote payloads.
author: Narean Prasath
date: 2026-07-07
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    process_name|contains: certutil
    command_line|contains: -urlcache
  condition: selection
falsepositives:
- Certificate administration
level: high
mitre:
  tactic: Command and Control
  technique: Ingress Tool Transfer
  attack_id: T1105
