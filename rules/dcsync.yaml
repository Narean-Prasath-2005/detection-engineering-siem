title: Active Directory DCSync Attack

id: DET-0007

status: stable

description: Detects replication requests associated with DCSync attacks.

author: Narean Prasath

date: 2026-07-07

logsource:
  product: windows
  service: security

detection:
  selection:
    event_id:
      - 4662
    access_mask:
      - "DS-Replication-Get-Changes"
      - "DS-Replication-Get-Changes-All"
  condition: selection

falsepositives:
  - Legitimate domain controller replication

level: critical

mitre:
  tactic: Credential Access
  technique: DCSync
  attack_id: T1003.006