title: Windows Firewall Disabled
id: DET-0004
status: stable
description: Detects Windows Firewall being disabled.
author: Narean Prasath
date: 2026-07-07
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    command_line|contains: netsh advfirewall set allprofiles state off
  condition: selection
falsepositives:
- Administrator configuration
level: high
mitre:
  tactic: Defense Evasion
  technique: Impair Defenses
  attack_id: T1562.004
